pre-commit:
  jobs:
    - run: pnpm dlx ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
    - run: pnpm plugin:sync
      glob:
        - "skills/**"
        - "kimi.plugin.json"
        - "public/icon.svg"
      stage_fixed: true
